name: Build CalorPulse APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python & Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2 requests

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Auto Accept Licenses
        run: |
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - name: Generate Flutter App Directory
        run: |
          flet build apk --no-web-renderer || true

      - name: Build Final Release APK
        run: |
          if [ -d "build/flutter" ]; then
            cd build/flutter
            flutter build apk --release
          elif [ -d "build/apk" ]; then
            echo "APK already generated in build/apk"
          fi

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: CalorPulse-APK
          path: |
            build/apk/*.apk
            build/flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
